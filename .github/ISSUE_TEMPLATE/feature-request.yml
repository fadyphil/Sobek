name: ✨ Feature Request
description: Propose a new idea for Sobek.
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Desired Feature
      placeholder: I want Sobek to be able to...
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this needed?
  - type: textarea
    id: examples
    attributes:
      label: Example Inputs/Outputs
